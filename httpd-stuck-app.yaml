apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpd-stuck-app
  labels:
    app: httpd-stuck-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpd-stuck-app
  template:
    metadata:
      labels:
        app: httpd-stuck-app
    spec:
      containers:
      - name: httpd
        image: httpd:2.4
        ports:
        - containerPort: 80
        command: ["/bin/sh", "-c"]
        args:
        - |
          # Create initial healthy endpoint
          echo "OK" > /usr/local/apache2/htdocs/health
          
          # Degrade health check after 10 seconds in background
          (sleep 10 && echo "500 Internal Server Error" > /usr/local/apache2/htdocs/health) &
          
          # Keep httpd running in foreground so container never stops
          exec httpd-foreground
