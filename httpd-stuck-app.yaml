apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpd-stuck-app
  labels:
    app: httpd-stuck-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpd-stuck-app
  template:
    metadata:
      labels:
        app: httpd-stuck-app
    spec:
      containers:
      - name: httpd
        image: httpd:2.4
        ports:
        - containerPort: 80
        command: ["/bin/sh", "-c"]
        args:
        - |
          # Enable htaccess overriding for custom HTTP response codes
          sed -i 's/AllowOverride None/AllowOverride All/g' /usr/local/apache2/conf/httpd.conf
          
          # Create initial healthy healthcheck endpoint (HTTP 200)
          echo "OK" > /usr/local/apache2/htdocs/health
          
          # After 10 seconds, write an htaccess rule that causes /health to return HTTP 500
          (sleep 10 && echo 'Redirect 500 /health' > /usr/local/apache2/htdocs/.htaccess) &
          
          # Keep Apache running in foreground so the pod stays in "Running" state
          exec httpd-foreground
