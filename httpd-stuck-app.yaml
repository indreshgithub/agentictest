apiVersion: v1
kind: Namespace
metadata:
  name: customer-dev
  labels:
    app.kubernetes.io/managed-by: pod-error-simulation
    environment: development
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpd-stuck-app
  namespace: customer-dev
  labels:
    app: httpd-stuck-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpd-stuck-app
  template:
    metadata:
      labels:
        app: httpd-stuck-app
    spec:
      securityContext:
        runAsUser: 0
      containers:
        - name: httpd
          image: httpd:2.4
          ports:
            - containerPort: 80
          command: ["/bin/sh", "-c"]
          args:
            - |
              sed -i 's/AllowOverride None/AllowOverride All/g' /usr/local/apache2/conf/httpd.conf
              echo "OK" > /usr/local/apache2/htdocs/health
              (sleep 10 && echo 'Redirect 500 /health' > /usr/local/apache2/htdocs/.htaccess) &
              (while true; do
                echo "ERROR: Connection refused: simulated database service unavailable" >&2
                sleep 2
              done) &
              exec httpd-foreground
