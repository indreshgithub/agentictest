apiVersion: v1
kind: Namespace
metadata:
  name: customer-dev
  labels:
    app.kubernetes.io/managed-by: pod-error-simulation
    environment: development
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpd-stuck-app
  namespace: customer-dev
  labels:
    app: httpd-stuck-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpd-stuck-app
  template:
    metadata:
      labels:
        app: httpd-stuck-app
    spec:
      securityContext:
        runAsUser: 0
      containers:
        - name: httpd
          image: httpd:2.4
          ports:
            - containerPort: 80
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Enable htaccess overriding and load rewrite module
              sed -i 's/AllowOverride None/AllowOverride All/g' /usr/local/apache2/conf/httpd.conf
              sed -i 's/#LoadModule rewrite_module/LoadModule rewrite_module/g' /usr/local/apache2/conf/httpd.conf
              
              # Initial healthy state (HTTP 200)
              echo "OK" > /usr/local/apache2/htdocs/health
              
              # Delay for 30 seconds before triggering HTTP 500 error on /health
              (sleep 30 && echo -e "RewriteEngine On\nRewriteRule ^health$ - [R=500,L]" > /usr/local/apache2/htdocs/.htaccess) &
              
              # Delay for 30 seconds, then start continuously logging database errors
              (sleep 30 && while true; do
                echo "ERROR: Connection refused: simulated database service unavailable" >&2
                sleep 2
              done) &
              
              exec httpd-foreground
---
apiVersion: v1
kind: Service
metadata:
  name: httpd-stuck-app
  namespace: customer-dev
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: httpd-stuck-app
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: httpd-stuck-app
  namespace: customer-dev
spec:
  to:
    kind: Service
    name: httpd-stuck-app
